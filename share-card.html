<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名片圖產生器 — 1040×1040</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#f6f3ee; --surface:#fffdfa; --surface-2:#efebe3; --edge:#e3ddd2;
    --ink:#2b2824; --ink-dim:#7f7a70; --accent:#7d9a74; --accent-2:#8fa8c0;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:var(--font); background:#e8e3da; color:var(--ink);
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:24px 16px 40px; gap:18px;
  }
  .note{
    max-width:560px; font-size:13px; line-height:1.85; color:#5d584f;
    background:var(--surface); border:1px solid var(--edge); border-radius:14px; padding:16px 18px;
  }
  .note b{ color:var(--ink); }
  .note code{
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
    background:var(--surface-2); border:1px solid var(--edge); border-radius:5px; padding:1px 6px; color:#5a7553;
  }

  /* 預覽框：裡面那張圖永遠是 1040×1040，只是被縮小顯示 */
  .frame{ overflow:hidden; border-radius:18px; box-shadow:0 22px 50px -22px rgba(60,52,40,.6); flex:none; }

  /* ═══════════ 以下就是會匯出成 PNG 的那張圖 ═══════════ */
  #card{
    width:1040px; height:1040px; flex:none;
    transform-origin:top left;
    position:relative; overflow:hidden;
    /* 漸層終點不能寫 transparent：html2canvas 會往黑色補間，整片發灰 */
    background:
      radial-gradient(95% 70% at 50% 2%, #fffefb 0%, rgba(255,254,251,0) 72%),
      linear-gradient(168deg,#f8f5f0,#ece7dd);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:56px 86px;
  }
  #card .topline{
    position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg,rgba(125,154,116,0),#7d9a74,rgba(125,154,116,0));
  }
  #card .ring{
    width:252px; height:336px; border-radius:24px; flex:none;
    display:grid; place-items:center; overflow:hidden;
    border:9px solid #fffdfa;
    box-shadow:0 0 0 2px var(--edge), 0 26px 50px -22px rgba(60,52,40,.55);
    background:linear-gradient(145deg,#f3efe7,#e8e3d9);
  }
  #card .ring img{ width:100%; height:100%; object-fit:cover; display:block; }
  #card .ring span{ font-size:100px; font-weight:300; color:var(--accent); }

  #card .name{ margin:36px 0 0; font-size:84px; font-weight:600; letter-spacing:.1em; line-height:1.1; }
  #card .name-en{ margin:16px 0 0; font-size:24px; letter-spacing:.46em; color:var(--ink-dim); text-transform:uppercase; }
  #card .role{
    display:inline-block; margin:26px 0 0; padding:10px 30px;
    font-size:31px; letter-spacing:.1em; color:var(--accent);
    border:2px solid rgba(125,154,116,.45); border-radius:999px; background:rgba(125,154,116,.08);
  }
  #card .org{ margin:16px 0 0; font-size:28px; color:var(--ink-dim); letter-spacing:.08em; }
  #card .tagline{ margin:30px 0 0; font-size:27px; line-height:1.7; color:#5d584f; max-width:23em; }

  /* 底部改成正常流排版，不再絕對定位，就不會壓到上面的文字 */
  #card .foot{
    margin-top:34px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  #card .ig{ font-size:24px; letter-spacing:.14em; color:var(--ink-dim); }
  #card .hint{ font-size:24px; letter-spacing:.2em; color:var(--accent); font-weight:600; }
  /* ═══════════ 匯出區結束 ═══════════ */

  .bar{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button{
    appearance:none; font-family:inherit; cursor:pointer; font-size:14px; letter-spacing:.04em;
    border:1px solid var(--edge); background:var(--surface); color:var(--ink);
    border-radius:13px; padding:14px 22px; transition:transform .12s;
  }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--accent); color:#fff; border-color:transparent; font-weight:600; }
  button:disabled{ opacity:.5; cursor:default; }
  .status{ font-size:12.5px; color:#5d584f; min-height:1.4em; }
</style>
</head>
<body>

<div class="note">
  <b>這頁只是產圖工具，本身不用上線。</b>
  按「下載 card.png」就會輸出 1040×1040 的名片圖（LINE 圖文訊息指定尺寸）。<br><br>
  <b>產出的 card.png 有兩個用途：</b><br>
  ① <b>路線 A</b>：上傳到 OA Manager →「圖文訊息」，在圖上設連結。<br>
  ② <b>路線 B</b>：跟網站一起上傳，把公開網址填進 <code>index.html</code> 的
  <code>CARD_IMAGE_URL</code>，供 LIFF 分享使用。
</div>

    <h1 class="name">陳詠筑</h1>
    <p class="name-en">Rita Chen</p>
    <p class="role">AI 應用師</p>
    <p class="org">國立中央大學 醫學工程研究所</p>
    <p class="tagline">把模型接進資料，<br>把資料變成答案。</p>

    <div class="foot">
      <div class="ig">@rita29ood</div>
      <div class="hint">點一下看完整介紹</div>
    </div>
  </div>
</div>

<div class="bar">
  <button class="primary" id="btnPng">下載 card.png</button>
  <button id="btnJpg">下載 card.jpg（檔案較小）</button>
</div>
<div class="status" id="status"></div>

<script>
const card   = document.getElementById("card");
const frame  = document.getElementById("frame");
const status = document.getElementById("status");

/* ───────── 頭像缺檔時改用文字 ───────── */
const ca = document.getElementById("cardAvatar");
ca.addEventListener("error", () => {
  ca.hidden = true;
  document.getElementById("cardAvatarFallback").hidden = false;
  status.textContent = "找不到 avatar.jpg，先用文字頭像預覽。";
});

/* ───────── 把 1040px 的卡片縮到畫面裡預覽 ───────── */
function fit(){
  const avail = Math.min(window.innerWidth - 32, 560);
  const scale = avail / 1040;
  card.style.transform = "scale(" + scale + ")";
  frame.style.width  = Math.round(1040 * scale) + "px";
  frame.style.height = Math.round(1040 * scale) + "px";
}
fit();
addEventListener("resize", fit);

/* ───────── 匯出 ───────── */
async function exportImage(type, ext, quality){
  const btns = document.querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  status.textContent = "產圖中…";

  const saved = card.style.transform;
  card.style.transform = "none";          // 取消縮放才會輸出完整 1040×1040

  try {
    const canvas = await html2canvas(card, {
      width:1040, height:1040, scale:1,
      backgroundColor:"#f6f3ee", useCORS:true, logging:false
    });
    const blob = await new Promise(r => canvas.toBlob(r, type, quality));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "card." + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    status.textContent = "已下載 card." + ext + "（" + Math.round(blob.size/1024) + " KB）";
  } catch (err) {
    console.error(err);
    status.textContent = "產圖失敗，請看瀏覽器主控台。";
  } finally {
    card.style.transform = saved;
    btns.forEach(b => b.disabled = false);
  }
}

document.getElementById("btnPng").addEventListener("click", () => exportImage("image/png", "png"));
document.getElementById("btnJpg").addEventListener("click", () => exportImage("image/jpeg", "jpg", 0.92));
</script>
